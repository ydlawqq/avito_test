# =====================================================================
# Конфигурация пайплайна Candidate Generation
# =====================================================================

paths:
  data_dir: raw_data
  train_file: raw_data/train.parquet
  corpus_file: raw_data/benchmark_items.parquet
  queries_file: raw_data/benchmark_queries.parquet
  artifacts_dir: artifacts

data:
  # Ограничение длины текста при токенизации
  max_query_len: 32           # токенов на запрос
  max_item_text_chars: 512    # символов title+params+description
  sample_queries_limit: null  # null = все запросы; иначе сколько обработать

model:
  encoder_name: ai-forever/sbert_large_nlu_ru  # RU-эмбеддинги для пары текстов
  # encoder_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  pooler: mean
  trainable_encoder: true
  embedding_dim: null  # определяется из модели; принудительно через проекцию

training:
  batch_size: 64
  epochs: 1
  lr: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  # Число негативов сверх in-batch (0 = только негативы из батча)
  extra_negatives: 4
  seed: 42
  max_steps: null          # null = не ограничивать
  grad_accumulation: 1

retrieval:
  k: 50                    # число кандидатов на запрос
  index_type: flat         # flat | ivf | hnsw
  nprobe: 16
  ef_search: 256
  batch_size_queries: 256
  normalize_embeddings: true

evaluation:
  metrics: [recall@k, mrr@k]
  k: 50